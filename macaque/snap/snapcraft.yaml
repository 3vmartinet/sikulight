name: macaque
version: 0.0.1
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-macaque: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.macaque # adjust accordingly to your app name

apps:
  macaque:
    command: macaque
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-macaque
parts:
  macaque:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
