name: macaque
description: "Macaque"
publish_to: "none"

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5
  shared_preferences: ^2.5.5
  equatable: ^2.0.8
  path_provider: ^2.1.5
  vyuh_node_flow: ^0.27.3
  value_notifier_tools: ^0.1.2
  uuid: ^4.5.3
  collection: ^1.19.1
  desktop_drop: ^0.7.1
  watcher: ^1.1.0
  image: ^4.2.0
  path: ^1.9.1
  file_picker: ^11.0.2
  archive: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  icons_launcher: ^3.1.0
  flutter_lints: ^6.0.0
  mockito: ^5.6.4
  build_runner: ^2.15.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

# dart run icons_launcher:create
icons_launcher:
  image_path: "assets/icons/macaque.png"
  platforms:
    macos:
      enable: true
    linux:
      enable: true
    windows:
      enable: true
